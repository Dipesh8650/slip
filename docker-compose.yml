services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slip}
      POSTGRES_DB: ${POSTGRES_DB:-slip}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slip} -d ${POSTGRES_DB:-slip}"]
      interval: 2s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-slip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slip}
      POSTGRES_DB: ${POSTGRES_DB:-slip}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
